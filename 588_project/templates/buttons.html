{% extends "base.html" %}
{% block title %}Buttons{% endblock %}
{% block content %}
<h1 class="text-3xl font-bold mb-2">Buttons</h1>
<p class="text-gray-400 mb-6">Manage main buttons and partner links</p>

<div class="bg-[#0e0e10] p-6 rounded-lg mb-6">
  <form action="{{ url_for('buttons_page') }}" method="post" class="grid grid-cols-3 gap-4">
    <input name="title" class="p-3 rounded bg-[#0b0b0c]" placeholder="Button title"/>
    <input name="path" class="p-3 rounded bg-[#0b0b0c]" placeholder="/path or external link"/>
    <div class="flex items-end"><button class="px-5 py-3 bg-white text-black rounded">+ Add Button</button></div>
  </form>
</div>

<div class="bg-[#0e0e10] p-6 rounded-lg">
  <h3 class="font-semibold mb-4">Main Buttons</h3>
  <div class="space-y-3">
    {% for b in buttons %}
      <div class="flex items-center justify-between p-3 bg-[#0b0b0c] rounded">
        <div>{{ b['title'] }} <div class="text-xs text-gray-500">{{ b['path'] }}</div></div>
        <form method="post" action="{{ url_for('delete_button', id=b['id']) }}">
          <button class="px-3 py-2 bg-red-700 rounded">Delete</button>
        </form>
      </div>
    {% else %}
      <div class="text-gray-400">No buttons yet.</div>
    {% endfor %}
  </div>
</div>
{% endblock %}
