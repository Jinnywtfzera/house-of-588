{% extends "base.html" %}
{% block title %}Configuration{% endblock %}
{% block content %}
<h1 class="text-3xl font-bold mb-2">Configuration</h1>
<p class="text-gray-400 mb-6">Customize application settings and branding</p>

<form method="post" class="bg-[#0e0e10] p-6 rounded-lg">
  <div class="grid grid-cols-2 gap-4">
    <div>
      <label class="text-sm text-gray-300">Brand Symbol</label>
      <input name="brand_symbol" value="{{ cfg.get('brand_symbol','A') }}" class="w-full p-3 rounded bg-[#0b0b0c]"/>
    </div>
    <div>
      <label class="text-sm text-gray-300">Brand Name</label>
      <input name="brand_name" value="{{ cfg.get('brand_name','Admin Panel') }}" class="w-full p-3 rounded bg-[#0b0b0c]"/>
    </div>
    <div>
      <label class="text-sm text-gray-300">Badge Text</label>
      <input name="badge_text" value="{{ cfg.get('badge_text','WELCOME') }}" class="w-full p-3 rounded bg-[#0b0b0c]"/>
    </div>
    <div>
      <label class="text-sm text-gray-300">Main Title</label>
      <input name="main_title" value="{{ cfg.get('main_title','Admin Panel') }}" class="w-full p-3 rounded bg-[#0b0b0c]"/>
    </div>
    <div class="col-span-2">
      <label class="text-sm text-gray-300">Subtitle</label>
      <input name="subtitle" value="{{ cfg.get('subtitle','') }}" class="w-full p-3 rounded bg-[#0b0b0c]"/>
    </div>
  </div>
  <div class="mt-4">
    <button class="px-5 py-3 bg-green-700 rounded">Save Settings</button>
  </div>
</form>
{% endblock %}
